networks:
  gjgit:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  forgejo_data:
  shared_token:       # Written by bootstrap, read by gitea-mirror
  ghproxy_cache:
  smart_git_cache:    # Git bare repo cache for Smart-Git (proxy profile)
  gitea_mirror_data:  # gitea-mirror SQLite DB + config (persisted across restarts)

services:

  # ── Reverse proxy + TLS ────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: gjgit-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    networks:
      - gjgit
    depends_on:
      forgejo:
        condition: service_healthy

  # ── Git hosting ────────────────────────────────────────────────────────────
  forgejo:
    image: codeberg.org/forgejo/forgejo:14
    container_name: gjgit-forgejo
    restart: unless-stopped
    environment:
      - USER_UID=${USER_UID:-1000}
      - USER_GID=${USER_GID:-1000}
      # Skip the web install wizard; bootstrap.sh creates admin via CLI
      - FORGEJO__security__INSTALL_LOCK=true
    volumes:
      - forgejo_data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${FORGEJO_SSH_PORT:-2222}:22"
    networks:
      - gjgit
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── First-run bootstrap (one-shot) ────────────────────────────────────────
  # Creates Forgejo admin user + generates API token into shared_token volume.
  # Runs to completion; gitea-mirror waits on it (proxy profile only).
  bootstrap:
    image: codeberg.org/forgejo/forgejo:14
    container_name: gjgit-bootstrap
    restart: "no"
    env_file: .env
    volumes:
      - ./scripts:/scripts:ro
      - shared_token:/shared
      - forgejo_data:/data      # bootstrap needs read-write: app.ini (read) + SQLite DB (write)
    networks:
      - gjgit
    entrypoint: ["/bin/sh", "/scripts/bootstrap.sh"]
    depends_on:
      forgejo:
        condition: service_healthy

  # ── GitHub mirror (proxy profile only) ───────────────────────────────────
  gitea-mirror:
    image: ghcr.io/raylabshq/gitea-mirror:latest
    container_name: gjgit-gitea-mirror
    restart: unless-stopped
    profiles: ["proxy"]
    env_file: .env
    environment:
      # Token: loaded from shared file by our entrypoint shim → exported as GITEA_TOKEN
      - GITEA_TOKEN_FILE=/shared/forgejo-token
      # Gitea connection
      - GITEA_URL=${GITEA_URL:-http://forgejo:3000}
      - GITEA_USERNAME=${GITEA_ADMIN_USERNAME}
      # GitHub connection
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_USERNAME=${GITHUB_USERNAME}
      # Mirror options
      - GITEA_MIRROR_INTERVAL=${GITEA_MIRROR_INTERVAL:-15m}
      - MIRROR_ISSUES=${MIRROR_ISSUES:-true}
      - MIRROR_RELEASES=${MIRROR_RELEASES:-true}
      - GITEA_LFS=${MIRROR_LFS:-true}
      # Automation: auto-import and schedule on startup
      - SCHEDULE_ENABLED=${SCHEDULE_ENABLED:-true}
      - AUTO_IMPORT_REPOS=${AUTO_IMPORT_REPOS:-true}
      # Auth
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=http://gitea-mirror:4321
    entrypoint: ["/bin/sh", "/scripts/gitea-mirror-entrypoint.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - shared_token:/shared:ro
      - gitea_mirror_data:/app/data
    networks:
      - gjgit
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:4321/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ── gitea-mirror first-run bootstrap (proxy profile only) ────────────────
  # Creates the gitea-mirror admin account on first boot (idempotent).
  mirror-bootstrap:
    image: alpine:3
    container_name: gjgit-mirror-bootstrap
    restart: "no"
    profiles: ["proxy"]
    env_file: .env
    environment:
      - GITEA_MIRROR_URL=http://gitea-mirror:4321
      - GITEA_MIRROR_ADMIN_EMAIL=${GITEA_MIRROR_ADMIN_EMAIL}
      - GITEA_MIRROR_ADMIN_PASSWORD=${GITEA_MIRROR_ADMIN_PASSWORD}
      - MIRROR_REPOS=${MIRROR_REPOS}
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - gjgit
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl jq -q && /scripts/mirror-bootstrap.sh"]
    depends_on:
      gitea-mirror:
        condition: service_healthy

  # ── Git clone cache sidecar (proxy profile only) ──────────────────────────
  # Caches bare git repos locally. ghproxy calls it for git clone/fetch/push.
  # Invalidation: TTL=5m + upstream hash check (see configs/smart-git/config.toml).
  # Limitation: public repos only; no disk eviction (monitor smart_git_cache usage).
  smart-git:
    image: wjqserver/smart-git:latest
    container_name: gjgit-smart-git
    restart: unless-stopped
    profiles: ["proxy"]
    volumes:
      - ./configs/smart-git:/data/smart-git/config:ro
      - smart_git_cache:/data/smart-git
    networks:
      - gjgit
    healthcheck:
      # smart-git image (Alpine minimal) has wget but not curl
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ── GitHub proxy + cache (proxy profile only) ─────────────────────────────────
  ghproxy:
    image: wjqserver/ghproxy:latest
    container_name: gjgit-ghproxy
    restart: unless-stopped
    profiles: ["proxy"]
    volumes:
      - ./configs/ghproxy:/data/ghproxy/config:ro
      - ghproxy_cache:/data/ghproxy/log
    networks:
      - gjgit
    depends_on:
      smart-git:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
