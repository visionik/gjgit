# gjgit — fly.io deployment (standalone mode)
#
# Deployment model: flyctl native multi-container Machines.
# flyctl v0.3.147+ parses docker-compose.fly.yml and maps services to
# containers on a single Fly Machine. Services communicate via localhost
# (/etc/hosts maps service names → 127.0.0.1 automatically).
# Fly.io handles TLS at the edge; Caddy runs HTTP-only internally.
#
# Usage:
#   task secrets:fly          # Import .env as Fly secrets (one-time + on change)
#   task deploy:fly           # Deploy / update standalone stack
#   task fly:ssh              # Open shell on the Machine
#
# For proxy mode (+ gitea-mirror + ghproxy), use fly-proxy.toml:
#   task deploy:fly:proxy

app            = "gjgit"
primary_region = "nrt"   # Tokyo, Japan — closest fly.io region to mainland China
kill_signal    = "SIGTERM"

[build]
  # flyctl v0.4.x+ parses this compose file (BuildCompose struct requires [build.compose]).
  # See docker-compose.fly.yml for Fly-specific adaptations.
  [build.compose]
    file = "docker-compose.fly.yml"

[http_service]
  # Fly proxy accepts HTTPS at the edge and forwards HTTP to Caddy on port 80.
  # Caddy handles path-based routing to Forgejo internally.
  internal_port       = 80
  force_https         = true
  auto_stop_machines  = false   # Keep always-on — git hosting must not cold-start
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size   = "performance-2x"   # 2 vCPU, 4GB RAM — minimum for Forgejo + Caddy
  memory = "4096"

# Fly Machines support only 1 volume per machine.
# Single volume covers Forgejo data AND the bootstrap token (as a subdirectory).
[[mounts]]
  source      = "forgejo_data"
  destination = "/mnt/data"
  # Layout inside the volume:
  #   /mnt/data/           → Forgejo data root (USER_UID writes here)
  #   /mnt/data/token/     → Bootstrap token (forgejo-token file)

# Fly Proxy configuration for SSH passthrough (Forgejo SSH on port 2222)
# Uncomment to enable SSH access:
# [[services]]
#   protocol   = "tcp"
#   internal_port = 22
#   [[services.ports]]
#     port = 2222
