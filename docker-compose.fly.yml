# gjgit — fly.io standalone compose
#
# Fly.io adaptations:
#   - env_file removed: secrets injected by Fly via `fly secrets import`
#   - Single volume at /mnt/data (Fly Machines support only 1 volume per machine)
#   - Caddy: port 80 only, no TLS (Fly handles HTTPS at the edge)
#   - No /etc/localtime bind mount (Fly machines use UTC)
#   - No ./scripts bind mount (flyctl can't embed directories; use fly ssh for bootstrap)
#   - Services communicate via localhost; names resolve via /etc/hosts injection
#
# First-run admin setup (after deploy):
#   fly ssh console --app gjgit
#   forgejo admin user create --admin --username admin --password <pass> --email <email>
#
# Deploy: task deploy:fly  (requires: fly auth login, task secrets:fly)

networks:
  gjgit:
    driver: bridge

services:

  # ── Reverse proxy (HTTP-only — Fly handles TLS) ───────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: gjgit-caddy
    restart: unless-stopped
    ports:
      - "80:80"        # Fly proxy forwards here; no 443 (Fly handles TLS)
    volumes:
      - ./Caddyfile.fly:/etc/caddy/Caddyfile:ro
      # No data volume needed — HTTP-only Caddy has no TLS state to persist
    networks:
      - gjgit
    depends_on:
      forgejo:
        condition: service_healthy

  # ── Git hosting ────────────────────────────────────────────────────────────
  forgejo:
    image: codeberg.org/forgejo/forgejo:14
    container_name: gjgit-forgejo
    restart: unless-stopped
    environment:
      USER_UID: "${USER_UID:-1000}"
      USER_GID: "${USER_GID:-1000}"
      FORGEJO__server__ROOT_URL: "${FORGEJO__server__ROOT_URL:-}"
      FORGEJO__server__SSH_DOMAIN: "${FORGEJO__server__SSH_DOMAIN:-}"
      FORGEJO__security__INSTALL_LOCK: "true"
    volumes:
      - /mnt/data:/data     # Single Fly volume — Forgejo data root
    networks:
      - gjgit
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Bootstrap runs manually via: fly ssh console --app gjgit
  # Then: forgejo admin user create --admin --username admin --password <pass> --email <email>
  # The ./scripts bind mount cannot be used on fly.io (flyctl cannot embed directories).
