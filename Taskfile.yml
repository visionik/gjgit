version: "3"

set: [errexit, nounset, pipefail]

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  # ── Setup wizard ──────────────────────────────────────────────────────────

  setup:deps:
    desc: Install gum (TUI toolkit) required by the setup wizard
    internal: true
    cmds:
      - sh scripts/setup-deps.sh

  setup:
    desc: "Interactive setup wizard — prompts for all config, writes .env"
    deps: [setup:deps]
    cmds:
      - sh scripts/setup.sh

  # ── Deployment ─────────────────────────────────────────────────────────────

  deploy:local:
    desc: "Start the stack locally using the mode set in .env (standalone or proxy)"
    cmds:
      - |
        MODE=$(grep '^GJGIT_MODE=' .env 2>/dev/null | cut -d= -f2 || echo "standalone")
        echo "Starting in ${MODE} mode..."
        if [ "$MODE" = "proxy" ]; then
          docker compose --profile proxy up -d
        else
          docker compose up -d
        fi

  package:
    desc: "Build a portable deployment bundle (.tar.gz) for any Docker host"
    cmds:
      - sh scripts/package.sh

  deploy:ssh:
    desc: "Deploy to a remote Docker host over SSH — requires HOST=user@host"
    requires:
      vars: [HOST]
    cmds:
      - HOST={{.HOST}} sh scripts/deploy-ssh.sh

  # ── Stack lifecycle ────────────────────────────────────────────────────────

  up:
    desc: Start the stack in standalone mode (Forgejo + Caddy)
    cmds:
      - docker compose up -d

  up:proxy:
    desc: Start the stack in proxy mode (Forgejo + Caddy + gitea-mirror + ghproxy)
    cmds:
      - docker compose --profile proxy up -d

  down:
    desc: Stop and remove containers (volumes preserved)
    cmds:
      - docker compose --profile proxy down

  down:volumes:
    desc: Stop and remove containers AND volumes (destructive — data loss)
    prompt: This will delete all Forgejo data, caches, and tokens. Continue?
    cmds:
      - docker compose --profile proxy down -v

  restart:
    desc: Restart all running services
    cmds:
      - docker compose --profile proxy restart

  pull:
    desc: Pull latest images for all services
    cmds:
      - docker compose --profile proxy pull

  logs:
    desc: "Follow logs for all services (pass SERVICE= to filter, e.g. task logs SERVICE=forgejo)"
    cmds:
      - docker compose --profile proxy logs -f {{.SERVICE}}
    vars:
      SERVICE: '{{default "" .SERVICE}}'

  ps:
    desc: Show running service status
    cmds:
      - docker compose --profile proxy ps

  # ── Quality ────────────────────────────────────────────────────────────────

  check:
    desc: Run all quality checks (lint + unit tests + integration tests)
    cmds:
      - task: lint
      - task: test

  lint:
    desc: Lint shell scripts with shellcheck
    cmds:
      - shellcheck scripts/*.sh || true

  fmt:
    desc: Format shell scripts (no-op placeholder — add shfmt when needed)
    cmds:
      - echo 'fmt ok (no formatter configured yet)'

  test:
    desc: Run unit tests then integration tests
    cmds:
      - task: test:unit
      - task: test:integration

  test:unit:
    desc: Run bats-core unit tests
    cmds:
      - bats tests/unit/

  test:integration:
    desc: Run docker compose integration tests (requires Docker)
    cmds:
      - bash tests/integration/standalone.sh
      - bash tests/integration/proxy.sh

  # ── Utilities ─────────────────────────────────────────────────────────────

  bootstrap:
    desc: Re-run the Forgejo bootstrap script (admin user + token generation)
    cmds:
      - docker compose run --rm bootstrap

  # ── fly.io deployment ────────────────────────────────────────────────────

  fly:bootstrap:
    desc: "One-time Fly.io setup: create app, volumes, and public IP"
    cmds:
      - sh scripts/fly-bootstrap.sh

  fly:bootstrap:proxy:
    desc: "One-time Fly.io setup for proxy mode (adds ghproxy_cache volume)"
    cmds:
      - sh scripts/fly-bootstrap.sh --proxy

  secrets:fly:
    desc: Upload .env secrets to Fly.io (run after editing .env)
    cmds:
      - sh scripts/fly-secrets.sh

  deploy:fly:
    desc: Deploy gjgit standalone mode to fly.io
    cmds:
      - fly deploy --config fly.toml

  deploy:fly:proxy:
    desc: Deploy gjgit proxy/mirror mode to fly.io
    cmds:
      - fly deploy --config fly-proxy.toml --image caddy:2-alpine

  fly:ssh:
    desc: Open an interactive shell on the Fly Machine
    cmds:
      - fly ssh console --app gjgit

  fly:logs:
    desc: "Tail Fly.io logs (pass APP=<name> to override app)"
    cmds:
      - fly logs --app '{{.APP}}'
    vars:
      APP: '{{default "gjgit" .APP}}'

  fly:status:
    desc: Show Fly Machine status and running containers
    cmds:
      - fly status --app gjgit
      - fly ssh console --app gjgit --command 'ps aux | head -20' 2>/dev/null || true

  fly:admin:create:
    desc: "Create the Forgejo admin user on fly.io (first-run, generates random password)"
    summary: |
      Creates the admin user inside the running Fly Machine using su-exec git.
      Prints the generated password — save it immediately.
      USERNAME defaults to 'gitadmin'; override with USERNAME=yourname EMAIL=you@x.com
    vars:
      USERNAME: '{{default "gitadmin" .USERNAME}}'
      EMAIL: '{{default "" .EMAIL}}'
    requires:
      vars: [EMAIL]
    cmds:
      - |
        echo "[fly:admin:create] Creating admin user '{{.USERNAME}}' on gjgit.fly.dev..."
        fly ssh console --app gjgit \
          --command "su-exec git forgejo admin user create --admin --username '{{.USERNAME}}' --email '{{.EMAIL}}' --random-password --must-change-password=false --config /data/gitea/conf/app.ini"
        echo ""
        echo "  Save the password printed above — it cannot be retrieved again."
        echo "  Change it at: https://gjgit.fly.dev/user/settings/security"

  fly:admin:reset:
    desc: "Reset a Forgejo admin user's password on fly.io (generates new random password)"
    vars:
      USERNAME: '{{default "gitadmin" .USERNAME}}'
    cmds:
      - |
        echo "[fly:admin:reset] Resetting password for '{{.USERNAME}}'..."
        fly ssh console --app gjgit \
          --command "su-exec git forgejo admin user change-password --username '{{.USERNAME}}' --random-password --config /data/gitea/conf/app.ini"
        echo ""
        echo "  Save the new password printed above."

  fly:smoke:
    desc: Run E2E smoke test against the live fly.io standalone deployment
    cmds:
      - sh scripts/fly-smoke.sh

  fly:smoke:proxy:
    desc: Run E2E smoke test against the live fly.io proxy deployment
    cmds:
      - sh scripts/fly-smoke.sh --proxy

  # ── Smoke test (local) ────────────────────────────────────────────────────

  test:proxy:live:
    desc: "End-to-end proxy mode test: starts full proxy stack, verifies all services, tests git clone via ghproxy"
    summary: |
      Requires a populated .env with REAL values:
        GITHUB_REPO, GITHUB_TOKEN, GITEA_ADMIN_USERNAME, GITEA_ADMIN_PASSWORD, GITEA_ADMIN_EMAIL
      Uses docker-compose.test.yml to expose ghproxy on :8181 and Forgejo on :3001.
      Runs automatically then tears down. Do NOT run in production.
    cmds:
      - |
        set -euo pipefail
        echo "=== [test:proxy:live] Starting proxy stack with test overrides ==="
        docker compose -f docker-compose.yml -f docker-compose.test.yml \
          --profile proxy --project-name gjgit-proxy-live up -d

        echo "=== Waiting for Forgejo (up to 90s) ==="
        for i in $(seq 1 18); do
          if curl -sf http://localhost:3001/api/v1/version >/dev/null 2>&1; then
            echo "  Forgejo healthy."; break
          fi
          echo "  attempt $i/18..."; sleep 5
          [ $i -eq 18 ] && echo "FAIL: Forgejo did not start" && exit 1
        done

        echo "=== Waiting for bootstrap to complete ==="
        # Use python3 to parse JSON — avoids Taskfile template engine eating {{.State.Status}}
        for i in $(seq 1 12); do
          STATUS=$(docker inspect gjgit-bootstrap 2>/dev/null | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['State']['Status'])" \
            2>/dev/null || echo "missing")
          [ "$STATUS" = "exited" ] && echo "  bootstrap exited." && break
          echo "  bootstrap status: $STATUS (attempt $i/12)..."; sleep 5
          [ $i -eq 12 ] && echo "FAIL: bootstrap did not complete" && exit 1
        done
        EXIT_CODE=$(docker inspect gjgit-bootstrap 2>/dev/null | \
          python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['State']['ExitCode'])" \
          2>/dev/null || echo 1)
        [ "$EXIT_CODE" != "0" ] && docker logs gjgit-bootstrap && \
          echo "FAIL: bootstrap exited $EXIT_CODE" && exit 1
        echo "  bootstrap exit code: 0 (admin created + token written)"

        echo "=== Checking smart-git health ==="
        for i in $(seq 1 6); do
          if curl -sf http://localhost:8181/ >/dev/null 2>&1; then
            echo "  ghproxy reachable."; break
          fi
          echo "  attempt $i/6..."; sleep 3
          [ $i -eq 6 ] && echo "FAIL: ghproxy not reachable" && exit 1
        done

        echo "=== Testing git clone via ghproxy ==="
        REPO=$(grep GITHUB_REPO .env | cut -d= -f2 | head -1 || echo "")
        if [ -n "$REPO" ]; then
          TEST_DIR=$(mktemp -d)
          echo "  Cloning $REPO via ghproxy (localhost:8181)..."
          git clone --depth 1 "http://localhost:8181/${REPO}.git" "${TEST_DIR}" 2>&1 && \
            echo "  Clone PASS: $(git -C ${TEST_DIR} rev-parse HEAD)" || \
            echo "  Clone WARN: failed (ghproxy may need GitHub connectivity)"
          rm -rf "${TEST_DIR}"
        else
          echo "  SKIP: GITHUB_REPO not set in .env"
        fi

        echo "=== Checking gitea-mirror status ==="
        docker logs gjgit-gitea-mirror 2>&1 | tail -10 || true

        echo ""
        echo "=== Proxy mode test complete. Tearing down... ==="
        docker compose -f docker-compose.yml -f docker-compose.test.yml \
          --profile proxy --project-name gjgit-proxy-live down -v --remove-orphans

  up:smoke:
    desc: Start stack with internal TLS for local smoke testing, wait for health, then tear down
    cmds:
      - |
        set -euo pipefail
        echo "Starting stack for smoke test..."
        docker compose up -d
        echo "Waiting for Forgejo to be healthy..."
        for i in $(seq 1 30); do
          if curl -sf http://localhost:3000/api/v1/version >/dev/null 2>&1; then
            echo "Forgejo is up."
            break
          fi
          echo "  attempt $i/30..."
          sleep 2
        done
        echo "Smoke test complete. Tearing down..."
        docker compose down
